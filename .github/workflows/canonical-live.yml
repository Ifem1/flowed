name: Flowed Canonical Live
on: [push, workflow_dispatch]

concurrency:
  group: flowed-canonical-live
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm ci
      - name: Verify canonical Studionet deployment and finalized reads
        run: node scripts/verify_canonical_live.mjs
