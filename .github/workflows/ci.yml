name: Flowed CI
on: [push, pull_request]

jobs:
  contract-static:
    name: contract-static
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned GenLayer toolchain
        run: python -m pip install -r requirements.txt
      - name: Contract syntax
        run: python scripts/validate_contract.py
      - name: GenVM lint and SDK validation
        run: genvm-lint check contracts/Flowed.py

  contract-tests:
    name: contract-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned GenLayer toolchain
        run: python -m pip install -r requirements.txt
      - name: Contract and protocol tests
        run: python -m pytest tests/contract tests/frontend -q

  direct-mode:
    name: genuine-direct-mode
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned GenLayer Direct Mode
        run: python -m pip install -r requirements.txt
      - name: Execute actual Flowed.py in Direct Mode
        run: python -m pytest tests/direct -q

  deployment-preflight:
    name: studionet-deployment-preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Verify canonical source and Studionet chain
        run: node scripts/deploy_preflight.mjs

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
